name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview: registered iPhones; production: TestFlight/App Store"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN || secrets.EXPO_ACCESS_TOKEN }}
      BUILD_PROFILE: ${{ inputs.profile }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID || '0ec1cf95-301c-44f9-8317-23b44d0f5234' }}
      LUXCARE_IOS_BUNDLE_IDENTIFIER: ${{ vars.LUXCARE_IOS_BUNDLE_IDENTIFIER || secrets.LUXCARE_IOS_BUNDLE_IDENTIFIER || 'com.luxcare.mobile' }}
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
      EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: "VP77TD9A77"
      EXPO_APPLE_TEAM_TYPE: "COMPANY_OR_ORGANIZATION"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Test build configuration helper
        run: node --test scripts/prepare-ios-build.check.cjs

      - name: Validate settings and pass public config to the EAS builder
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN || secrets.EXPO_ACCESS_TOKEN }}
        run: node scripts/prepare-ios-build.cjs

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        working-directory: .
        run: npm test

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN || secrets.EXPO_ACCESS_TOKEN }}

      - name: Configure App Store Connect API key for remote signing and submission
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const required = name => {
            const value = process.env[name]?.trim();
            if (!value) throw new Error('Missing GitHub secret: ' + name);
            return value;
          };
          const keyId = required('APP_STORE_CONNECT_API_KEY_ID');
          const issuerId = required('APP_STORE_CONNECT_ISSUER_ID');
          if (!/^[A-Z0-9]{10}$/.test(keyId)) throw new Error('Invalid App Store Connect Key ID');
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(issuerId)) {
            throw new Error('Invalid App Store Connect Issuer ID');
          }
          const rawKey = required('APP_STORE_CONNECT_API_KEY_BASE64');
          let key;
          if (rawKey.includes('-----BEGIN PRIVATE KEY-----')) {
            key = Buffer.from(rawKey + '\n');
          } else {
            const encoded = rawKey.replace(/\s/g, '');
            key = Buffer.from(encoded, 'base64');
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(encoded) ||
                key.toString('base64').replace(/=+$/, '') !== encoded.replace(/=+$/, '')) {
              throw new Error('Invalid base64 App Store Connect API key');
            }
          }
          try {
            const parsed = crypto.createPrivateKey(key);
            if (parsed.asymmetricKeyType !== 'ec' || parsed.asymmetricKeyDetails?.namedCurve !== 'prime256v1') {
              throw new Error('Expected EC P-256 key');
            }
          } catch {
            throw new Error('Invalid App Store Connect .p8 private key (expected EC P-256)');
          }
          const dir = path.join(process.env.RUNNER_TEMP, 'luxcare-asc');
          fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
          const keyPath = path.join(dir, 'AuthKey.p8');
          fs.writeFileSync(keyPath, key, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXPO_ASC_API_KEY_PATH=' + keyPath + '\n');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const profile = config.build[process.env.BUILD_PROFILE];
          const source = profile.ios?.credentialsSource ?? profile.credentialsSource ?? 'remote';
          if (source !== 'remote') throw new Error('This workflow requires Expo remote signing credentials');
          if (process.env.BUILD_PROFILE === 'production') {
            Object.assign(config.submit.production.ios, {
              ascApiKeyPath: keyPath, ascApiKeyId: keyId, ascApiKeyIssuerId: issuerId,
            });
            fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
          }
          console.log('Remote signing retained; App Store Connect API key configured.');
          NODE

      - name: Build signed IPA on EAS
        run: |
          set -euo pipefail
          echo "Building signed iOS IPA on EAS for profile: $BUILD_PROFILE..."
          eas build --platform ios --profile "$BUILD_PROFILE" --freeze-credentials --non-interactive --wait --json > "$RUNNER_TEMP/ios-build.json"

      - name: Download and validate IPA
        run: |
          set -euo pipefail
          BUILD_URL="$(jq -er '.[0] | select(.status == "FINISHED") | .artifacts.buildUrl | select(type == "string" and startswith("https://"))' "$RUNNER_TEMP/ios-build.json")"
          echo "::add-mask::$BUILD_URL"
          mkdir -p "$RUNNER_TEMP/ios-artifacts"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "$BUILD_URL" --output "$RUNNER_TEMP/ios-artifacts/LuxCare.ipa"
          unzip -tq "$RUNNER_TEMP/ios-artifacts/LuxCare.ipa"
          unzip -Z1 "$RUNNER_TEMP/ios-artifacts/LuxCare.ipa" > "$RUNNER_TEMP/ipa-contents.txt"
          grep -Eq '^Payload/[^/]+\.app/Info\.plist$' "$RUNNER_TEMP/ipa-contents.txt"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuxCare-ios-${{ inputs.profile }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ios-artifacts/LuxCare.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Submit production build to App Store Connect / TestFlight
        if: inputs.profile == 'production'
        run: |
          set -euo pipefail
          BUILD_ID="$(jq -er '.[0] | select(.status == "FINISHED") | .id' "$RUNNER_TEMP/ios-build.json")"
          echo "Submitting EAS production build $BUILD_ID to App Store Connect / TestFlight..."
          eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive --wait

      - name: Clean up App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/luxcare-asc/AuthKey.p8"

      - name: Build summary
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" != "success" ]]; then
            echo "### LuxCare iOS Build Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The build or submission did not complete successfully. Check workflow logs above for details." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$BUILD_PROFILE" == "production" ]]; then
            echo '### LuxCare iOS Production Build' >> "$GITHUB_STEP_SUMMARY"
            echo '- **Production IPA generated**: success' >> "$GITHUB_STEP_SUMMARY"
            echo '- **Submitted to App Store Connect**: success' >> "$GITHUB_STEP_SUMMARY"
            echo '- **Destination**: TestFlight' >> "$GITHUB_STEP_SUMMARY"
            echo '- **GitHub Artifact**: available' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Binary submitted to App Store Connect for TestFlight. Check App Store Connect -> TestFlight for processing status.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### LuxCare iOS Preview Build' >> "$GITHUB_STEP_SUMMARY"
            echo '- **Signed preview IPA generated**: success' >> "$GITHUB_STEP_SUMMARY"
            echo '- **GitHub Artifact**: available' >> "$GITHUB_STEP_SUMMARY"
            echo '- **Status**: Not submitted to App Store Connect' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Preview build only. Installs on registered devices included in the provisioning profile.' >> "$GITHUB_STEP_SUMMARY"
          fi

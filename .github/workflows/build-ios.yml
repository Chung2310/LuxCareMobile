name: Read-only App Store review audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read app metadata and review readiness
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node <<'NODE'
          const {createPrivateKey,sign}=require('node:crypto');
          (async()=>{
            const raw=process.env.ASC_KEY.trim();
            const key=createPrivateKey(raw.startsWith('-----BEGIN')?raw:Buffer.from(raw,'base64'));
            const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
            const now=Math.floor(Date.now()/1000);
            const data=enc({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+enc({iss:process.env.ASC_ISSUER,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
            const jwt=data+'.'+sign('sha256',Buffer.from(data),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const errors=[];
            async function get(path){
              const response=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method:'GET',headers:{Authorization:'Bearer '+jwt},signal:AbortSignal.timeout(25000)});
              if(!response.ok){errors.push({path,status:response.status});return null;}
              return response.json();
            }
            const appId='6815999878';
            const app=await get('/apps/'+appId);
            const versions=await get('/apps/'+appId+'/appStoreVersions?include=build&limit=10');
            const builds=await get('/builds?filter[app]='+appId+'&sort=-uploadedDate&limit=5');
            const report={app:app?{id:app.data.id,name:app.data.attributes.name,bundleId:app.data.attributes.bundleId}:null,versions:[],latestBuilds:(builds?.data||[]).map(b=>({id:b.id,...Object.fromEntries(['version','uploadedDate','processingState','expired'].map(k=>[k,b.attributes[k]]))})),errors};
            for(const version of (versions?.data||[]).filter(v=>v.attributes.platform==='IOS')){
              const a=version.attributes;
              const buildId=version.relationships.build?.data?.id;
              const build=versions.included?.find(b=>b.type==='builds'&&b.id===buildId);
              const item={version:a.versionString,state:a.appStoreState,selectedBuild:build?.attributes.version,localizations:[],review:null};
              if(!['REPLACED_WITH_NEW_VERSION','READY_FOR_SALE','REMOVED_FROM_SALE'].includes(a.appStoreState)){
                const review=await get('/appStoreVersions/'+version.id+'/appStoreReviewDetail');
                if(review){
                  const r=review.data.attributes,notes=r.notes||'';
                  item.review={demoAccountRequired:r.demoAccountRequired,hasUsername:!!r.demoAccountName,hasPassword:!!r.demoAccountPassword,reviewAccountMatchesTested:r.demoAccountName?.trim().toLowerCase()==='igen1@gmail.com',hasContact:!!r.contactEmail&&!!r.contactPhone,notesLength:notes.length,notesMentionOrganization:/organization|enterprise|doanh nghi[eệ]p|t[oổ] ch[uứ]c/i.test(notes)};
                  if(r.demoAccountName&&r.demoAccountPassword){
                    const response=await fetch('https://luxcare.igentechnology.net/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json','x-luxcare-client':'mobile'},body:JSON.stringify({email:r.demoAccountName,password:r.demoAccountPassword}),signal:AbortSignal.timeout(25000)});
                    item.review.savedCredentialsLoginStatus=response.status;
                    await response.body?.cancel();
                  }
                }
                const locales=await get('/appStoreVersions/'+version.id+'/appStoreVersionLocalizations');
                for(const locale of locales?.data||[]){
                  const l=locale.attributes;
                  const sets=await get('/appStoreVersionLocalizations/'+locale.id+'/appScreenshotSets?include=appScreenshots');
                  item.localizations.push({locale:l.locale,description:l.description,supportUrl:l.supportUrl,marketingUrl:l.marketingUrl,screenshotCount:sets?.included?.filter(s=>s.type==='appScreenshots').length||0,screenshots:(sets?.included||[]).filter(s=>s.type==='appScreenshots').map(s=>({name:s.attributes.fileName,asset:s.attributes.imageAsset}))});
                }
              }
              report.versions.push(item);
            }
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error('Read-only audit failed: '+e.message);process.exit(1)});
          NODE

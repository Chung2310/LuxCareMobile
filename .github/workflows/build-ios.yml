name: Build iOS IPA (GitHub macOS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "production: TestFlight/App Store; preview: registered iPhones"
        type: choice
        required: true
        default: production
        options: [production, preview]
      upload_testflight:
        description: "Upload production IPA to App Store Connect / TestFlight"
        type: boolean
        default: true
      build_number:
        description: "Optional integer above the latest App Store Connect build; default = IOS_BUILD_NUMBER_BASE + run number"
        type: string
      app_version:
        description: "Optional marketing version; blank uses app.json"
        type: string

permissions:
  contents: read

# Serialize all signed builds, including different branches/profiles.
concurrency:
  group: luxcare-ios-signed
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      BUILD_PROFILE: ${{ inputs.profile }}
      UPLOAD_TESTFLIGHT: ${{ inputs.profile == 'production' && inputs.upload_testflight && 'true' || 'false' }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
      IOS_BUILD_NUMBER_BASE: ${{ vars.IOS_BUILD_NUMBER_BASE || '1000' }}
      APP_VERSION: ${{ inputs.app_version }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://luxcare.igentechnology.net' }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '0ec1cf95-301c-44f9-8317-23b44d0f5234' }}
      LUXCARE_IOS_BUNDLE_IDENTIFIER: ${{ vars.LUXCARE_IOS_BUNDLE_IDENTIFIER || 'com.luxcare.mobile' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'VP77TD9A77' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Validate build settings and Xcode
        run: |
          node --test scripts/prepare-ios-build.check.cjs
          node scripts/prepare-ios-build.cjs
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install root dependencies
        working-directory: .
        run: npm ci
      - name: Install mobile dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        working-directory: .
        run: npm test
      - name: Validate signing and archive helpers
        run: |
          node --test scripts/configure-ios-signing.check.cjs
          python3 scripts/ios-signing.check.py
          bash -n scripts/build-signed-ios.sh
      - name: Check production B2B backend
        if: inputs.profile == 'production'
        env:
          LUXCARE_REVIEW_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}
        run: npm run review:preflight

      - name: Generate native iOS project
        run: npx --no-install expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Install signing credentials in temporary keychain
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ (inputs.profile == 'production' && secrets.IOS_APP_STORE_PROFILE_BASE64 || inputs.profile == 'preview' && secrets.IOS_ADHOC_PROFILE_BASE64) || secrets.PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 scripts/ios-signing.py install

      - name: Configure app target signing
        run: node scripts/configure-ios-signing.cjs
      - name: Archive and export signed IPA on GitHub macOS
        run: bash scripts/build-signed-ios.sh

      - name: Save signed IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: LuxCare-ios-${{ inputs.profile }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/luxcare-ios-artifacts/LuxCare.ipa
            ${{ runner.temp }}/luxcare-ios-artifacts/LuxCare-dSYMs.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload production IPA to TestFlight
        if: inputs.profile == 'production' && inputs.upload_testflight
        run: |
          set -euo pipefail
          # API_PRIVATE_KEYS_DIR is scoped to this process; no key enters the repository.
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/luxcare-ios-signing/asc" \
            xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/luxcare-ios-artifacts/LuxCare.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Save native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuxCare-ios-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/luxcare-ios-archive.log
            ${{ runner.temp }}/luxcare-ios-export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: python3 scripts/ios-signing.py cleanup
      - name: Build summary
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          {
            echo "Build status: $BUILD_STATUS"
            echo "Builder: GitHub macOS / Xcode (no EAS Build)"
            echo "Profile: $BUILD_PROFILE; build number: ${IOS_BUILD_NUMBER:-not-configured}"
            if [[ "$BUILD_STATUS" == success && "$UPLOAD_TESTFLIGHT" == true ]]; then
              echo "IPA uploaded to App Store Connect. Check TestFlight processing before selecting the build."
            fi
            echo "App Review submission and Public distribution are managed in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"
